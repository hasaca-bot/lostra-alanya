<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lostra Alanya | Talep Yönetimi</title><link href="/font.css" rel="stylesheet"><style>
:root{--bg:#f4f1ec;--paper:#fffefa;--ink:#24231f;--muted:#706b63;--line:#ddd5ca;--orange:#a54515;--orange-light:#f7e9df;--shadow:0 18px 45px #4534240b}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Google Sans',Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}a{color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:2px}.shell{max-width:1560px;margin:auto;padding:0 28px 50px}.top{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:1rem}.brand{text-decoration:none;display:flex;gap:12px;align-items:center;font-weight:800;letter-spacing:.04em}.brand-mark{background:var(--ink);color:#fff;width:38px;height:38px;display:grid;place-items:center;font-family:'Google Sans',Arial,sans-serif;font-size:24px}.top-links{display:flex;align-items:center;gap:16px}.top-links a{text-decoration:none;color:var(--muted);font-size:.9rem}.top-links a:hover{color:var(--orange)}.live{display:flex;align-items:center;gap:7px;font-size:.77rem;font-weight:700;color:#657565}.live::before{content:'';width:7px;height:7px;border-radius:50%;background:#88a782;box-shadow:0 0 0 4px #e3ede0}.intro{padding:42px 0 29px;display:flex;justify-content:space-between;gap:2rem;align-items:end}.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.2em;color:var(--orange);font-weight:800}.intro h1{font-family:'Google Sans',Arial,sans-serif;font-size:clamp(2.2rem,4vw,3.55rem);line-height:1.1;margin:9px 0}.intro p{margin:0;color:var(--muted)}.date{text-align:right;color:var(--muted);font-size:.84rem}.toolbar{display:flex;gap:12px;margin:4px 0 25px;align-items:center}.search{flex:1;max-width:430px;border:1px solid var(--line);background:var(--paper);padding:13px 16px;border-radius:5px}.refresh{border:1 ation:fade .2s ease}.overlay[hidden]{display:none}.drawer{width:min(100%,620px);height:100%;overflow:auto;background:var(--paper);padding:26px 30px 40px;box-shadow:-20px 0 50px #0002;animation:slide .28s cubic-bezier(.22,1,.36,1)}.drawer-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.close{border:1px solid var(--line);background:transparent;width:40px;height:40px;border-radius:4px;font-size:1.5rem}.drawer h2{font-family:'Google Sans',Arial,sans-serif;font-size:2rem;margin:7px 0 15px}.detail-code{color:var(--orange);font-size:.8rem;font-weight:800;letter-spacing:.12em}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.photo-grid a{display:block}.photo-grid img{width:100%;height:150px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}.detail-section{border-top:1px solid var(--line);padding:17px 0}.detail-section h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin:0 0 11px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail-grid p{margin:0;font-size:.9rem;line-height:1.5}.detail-grid strong{display:block;font-size:.72rem;color:var(--muted);margin-bottom:2px}.detail-section>p{font-size:.9rem;line-height:1.6;white-space:pre-wrap}.detail-section label{display:block;font-size:.8rem;font-weight:800;margin:0 0 6px}.detail-section input,.detail-section select,.detail-section textarea{width:100%;border:1px solid #cfc3b6;background:#fff;padding:11px 12px;border-radius:4px;margin:0 0 14px}.detail-section textarea{resize:vertical;min-height:90px}.save{width:100%;border:0;border-radius:4px;background:var(--orange);color:white;font-weight:800;padding:14px}.save:hover{background:#87350e}.save-message{min-height:1.3rem;color:#a32f1e;font-size:.83rem}.privacy-note{font-size:.74rem;color:var(--muted);margin-top:28px}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes slide{from{transform:translateX(30px);opacity:.5}to{transform:none;opacity:1}}@media(max-width:1250px){.board{grid-template-columns:repeat(5,240px);overflow-x:auto;padding-bottom:18px;scroll-snap-type:x mandatory}.column{scroll-snap-align:start}}@media(max-width:600px){.shell{padding:0 16px 36px}.top{height:66px}.top-links a:first-child{display:none}.intro{padding:30px 0 23px}.date{display:none}.toolbar{margin-bottom:17px}.board{grid-template-columns:repeat(5,82vw)}.drawer{padding:18px}.photo-grid img{height:100px}.detail-grid{grid-template-columns:1fr 1fr}.live{font-size:0}.live::before{font-size:initial}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
